<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <!-- SEO Meta -->
    <title>Rahul's Portfolio</title>
    <meta name="description" content="Rahul Dange: Computer Science graduate from the University of Sydney. Proficient in C, C++, memory management, concurrency, and full-stack web development." />
    <meta name="author" content="Rahul Dange" />

    <!-- Open Graph -->
    <meta property="og:title" content="Rahul's Portfolio" />
    <meta property="og:description" content="Computer Science graduate from the University of Sydney with a strong foundation in systems programming and low-level software development." />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23000000' /%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.34em' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='64' font-weight='400' fill='%23ffffff'%3ER%3C/text%3E%3C/svg%3E" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Inter Variable (14-32px optical size) + JetBrains Mono Variable -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />

    <!-- Critical inline CSS: skeleton of hero section for instant first paint -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      /* Minimal loading skeleton */
      .app-skeleton {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #64748b;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      .app-skeleton::after {
        content: 'initializing...';
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static skeleton shown until React hydrates — matches light theme -->
      <div class="app-skeleton"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
